name: ArgonScanPro
options:
  bundleIdPrefix: com.argonscan
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MTL_ENABLE_DEBUG_INFO: "NO"
    MTL_FAST_MATH: "YES"
    INFOPLIST_KEY_NSCameraUsageDescription: "ArgonScan Pro 需要访问后置三摄、LiDAR 激光雷达与前置原深感 TrueDepth 相机以执行高精度 3D 扫描重建。"
    INFOPLIST_KEY_NSMotionUsageDescription: "ArgonScan Pro 需要读取陀螺仪与加速计数据以执行 100Hz 相机位姿防抖与运动模糊过滤。"
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "ArgonScan Pro 需要访问相册权限以保存扫描关键帧与导出结果。"
targets:
  ArgonScanPro:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: GeminiArgon
      - path: UI
      - path: Shaders
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ArgonScan Pro
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: "ArgonScan Pro 需要访问后置三摄、LiDAR 激光雷达与前置原深感 TrueDepth 相机以执行高精度 3D 扫描重建。"
        NSMotionUsageDescription: "ArgonScan Pro 需要读取陀螺仪与加速计数据以执行 100Hz 相机位姿防抖与运动模糊过滤。"
        NSPhotoLibraryAddUsageDescription: "ArgonScan Pro 需要访问相册权限以保存扫描关键帧与导出结果。"
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
          - arkit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argonscan.iphone13promax
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_BITCODE: "NO"
    dependencies:
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: SwiftUI.framework
