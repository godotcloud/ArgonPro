name: ArgonScanPro
options:
  bundleIdPrefix: com.argonscan
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MTL_ENABLE_DEBUG_INFO: "NO"
    MTL_FAST_MATH: "YES"
targets:
  ArgonScanPro:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: GeminiArgon
      - path: UI
      - path: Shaders
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argonscan.iphone13promax
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: "NO"
    dependencies:
      - sdk: ARKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: SwiftUI.framework
