name: Build ArgonScan Pro iOS (.ipa)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.swift'
      - '**.metal'
      - 'project.yml'
      - '**.zip'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      signed_build:
        description: "使用 Apple 开发者证书签名 (需配置 Secrets，默认 false 生成免签 .ipa)"
        required: false
        default: "false"

jobs:
  build-ios-ipa:
    name: Compile Swift + Metal & Package IPA
    runs-on: macos-15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Extract ZIP if project.yml Not Yet Extracted
        run: |
          if [ ! -f "project.yml" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
              echo "检测到仓库尚未解压 project.yml，正在自动解压: $ZIP_FILE"
              unzip -o "$ZIP_FILE" -d . -x "__MACOSX/*" "*.DS_Store"
            fi
          fi

      - name: 3. Select Stable Xcode 16+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 4. Generate Xcode Project & Enforce TCC Privacy Keys in Info.plist
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

          # 强制写入相机、陀螺仪与相册隐私权限描述，防止 XcodeGen 覆盖 Info.plist 导致点击 Start Capture 闪退
          plutil -replace NSCameraUsageDescription -string "ArgonScan Pro 需要访问后置三摄、LiDAR 激光雷达与前置原深感相机以执行高精度 3D 扫描。" App/Info.plist
          plutil -replace NSMotionUsageDescription -string "ArgonScan Pro 需要读取陀螺仪与加速计数据以执行 100Hz 运动模糊过滤。" App/Info.plist
          plutil -replace NSPhotoLibraryAddUsageDescription -string "ArgonScan Pro 需要访问相册以保存扫描结果。" App/Info.plist
          plutil -replace CADisableMinimumFrameDurationOnPhone -bool YES App/Info.plist
          plutil -p App/Info.plist

      - name: 5. Build Unsigned Release App & Package .ipa (Default / Sideload Mode)
        if: ${{ github.event.inputs.signed_build != 'true' }}
        run: |
          xcodebuild build \
            -project ArgonScanPro.xcodeproj \
            -scheme ArgonScanPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_NSCameraUsageDescription="ArgonScan Pro 需要访问相机与 LiDAR 进行 3D 扫描" \
            INFOPLIST_KEY_NSMotionUsageDescription="ArgonScan Pro 需要访问运动传感器进行防抖"

          # 校验编译产物 Info.plist 中的 NSCameraUsageDescription
          plutil -p build/Build/Products/Release-iphoneos/ArgonScanPro.app/Info.plist | grep -i Camera

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ArgonScanPro.app Payload/
          zip -r9 ArgonScanPro-iPhone13ProMax-Unsigned.ipa Payload

      - name: 6. Optional — Install Apple Certificate & Build Signed .ipa
        if: ${{ github.event.inputs.signed_build == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          xcodebuild archive \
            -project ArgonScanPro.xcodeproj \
            -scheme ArgonScanPro \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ArgonScanPro.xcarchive

      - name: 7. Upload Compiled .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArgonScanPro-iPhone13ProMax-IPA
          path: "*.ipa"
          retention-days: 30
